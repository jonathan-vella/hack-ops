# Reusable deployment workflow for Azure App Service.
# Called by hackops-deploy.yml for both dev and prod environments.
# Performs Bicep IaC deploy, staging slot health check, slot swap,
# and auto-rollback on health check failure.

name: Deploy Environment

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment (dev or prod)"
        required: true
        type: string
      image-tag:
        description: "Container image tag (SHA) to deploy"
        required: true
        type: string
      image-digest:
        description: "Container image digest (sha256:...) for immutable deploy"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy IaC (Bicep) — no --no-wait (P10)
        run: |
          az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/bicep/hackops/main.bicep \
            --parameters environment=${{ inputs.environment }} projectName=hackops \
              imageDigest=${{ inputs.image-digest }} \
              owner="${{ vars.AZURE_OWNER }}" \
              technicalContact="${{ vars.AZURE_TECHNICAL_CONTACT }}" \
              alertEmail="${{ vars.AZURE_ALERT_EMAIL }}" \
              githubOAuthClientId="${{ secrets.OAUTH_CLIENT_ID }}" \
              githubOAuthClientSecret="${{ secrets.OAUTH_CLIENT_SECRET }}" \
              adminGithubIds="${{ vars.ADMIN_GITHUB_IDS }}" \
            --mode Incremental

      - name: Wait for staging slot container to start
        run: |
          echo "Waiting for staging slot container to become ready..."
          STAGING_URL="https://${{ vars.AZURE_WEBAPP_NAME }}-staging.azurewebsites.net/api/health"
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$STAGING_URL" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Staging slot healthy (attempt $i)"
              break
            fi
            echo "Attempt $i: status $STATUS — retrying in 15s..."
            sleep 15
          done
          if [ "$STATUS" != "200" ]; then
            echo "::error::Staging slot failed health check after 20 attempts"
            exit 1
          fi

      - name: Swap staging to production slot
        run: |
          az webapp deployment slot swap \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_WEBAPP_NAME }}" \
            --slot staging \
            --target-slot production

      - name: Verify deployment health (auto-rollback on failure)
        run: |
          HEALTH_URL="https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/health"
          echo "Checking health at $HEALTH_URL ..."
          for i in 1 2 3 4 5 6; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: status $STATUS — retrying in 15s..."
            sleep 15
          done
          echo "::error::Health check failed — executing rollback swap"
          az webapp deployment slot swap \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_WEBAPP_NAME }}" \
            --slot staging \
            --target-slot production
          echo "Rollback swap completed — previous version restored"
          exit 1
