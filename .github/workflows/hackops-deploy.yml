# HackOps Deploy Workflow
# Builds container image, pushes to ACR, deploys via Bicep + slot swap.
# - dev: auto-deploys on push to main (staging slot swap)
# - production: manual dispatch with approval gate
#
# Prerequisites:
#   1. Azure AD app registration with federated credential for this repo
#   2. GitHub environments "dev" and "production" configured with OIDC secrets
#   3. "production" environment has required-reviewers protection rule
#   4. OIDC identity has AcrPush on ACR (see docs/first-deploy-runbook.md)
#
# OIDC setup (per environment):
#   AZURE_CLIENT_ID       — App registration client ID
#   AZURE_TENANT_ID       — Azure AD tenant ID
#   AZURE_SUBSCRIPTION_ID — Target subscription ID
#   AZURE_RESOURCE_GROUP  — Target resource group (e.g. rg-hackops-us-dev)
#   AZURE_WEBAPP_NAME     — App Service name (e.g. app-hackops-dev)
#
# Environment vars (per environment):
#   AZURE_ACR_NAME         — ACR resource name (e.g. crhackopsdevABC123)
#   AZURE_ACR_LOGIN_SERVER — ACR login server (e.g. crhackopsdevabc123.azurecr.io)
#   AZURE_OWNER            — Resource owner tag value
#   AZURE_TECHNICAL_CONTACT — Technical contact email tag value
#   ADMIN_GITHUB_IDS       — Comma-separated GitHub user IDs for admin auto-assign
#
# Environment secrets (per environment):
#   OAUTH_CLIENT_ID            — GitHub OAuth App client ID
#   OAUTH_CLIENT_SECRET        — GitHub OAuth App client secret

name: HackOps Deploy

on:
  workflow_run:
    workflows: ["HackOps CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - production
        default: dev

permissions:
  id-token: write
  contents: read
  security-events: write

concurrency:
  group: hackops-deploy-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  # ── Build container image, scan, push to ACR ─────────────────────────
  build:
    name: Build & Push Container
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: ${{ github.event.inputs.environment || 'dev' }}
    outputs:
      image-tag: ${{ steps.meta.outputs.sha }}
      image-digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Determine image tag from SHA (P11)
        id: meta
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.meta.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: hackops:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Grype vulnerability scan
        uses: anchore/scan-action@v7
        id: grype-scan
        with:
          image: hackops:${{ steps.meta.outputs.sha }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: sarif
          cache-db: true

      - name: Upload Grype scan results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.grype-scan.outputs.sarif }}

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: hackops:${{ steps.meta.outputs.sha }}
          format: spdx-json
          output-file: hackops-sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: Login to Azure (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name "${{ vars.AZURE_ACR_NAME }}"

      - name: Tag and push image (SHA only — no latest, P12)
        id: push
        run: |
          docker tag "hackops:${{ steps.meta.outputs.sha }}" \
            "${{ vars.AZURE_ACR_LOGIN_SERVER }}/hackops:${{ steps.meta.outputs.sha }}"
          docker push "${{ vars.AZURE_ACR_LOGIN_SERVER }}/hackops:${{ steps.meta.outputs.sha }}"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' \
            "${{ vars.AZURE_ACR_LOGIN_SERVER }}/hackops:${{ steps.meta.outputs.sha }}" \
            | sed 's/.*@//')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

  # ── Deploy to dev ────────────────────────────────────────────────────
  deploy-dev:
    name: Deploy to Dev
    needs: build
    if: >-
      (github.event_name == 'workflow_run') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    uses: ./.github/workflows/_deploy-environment.yml
    with:
      environment: dev
      image-tag: ${{ needs.build.outputs.image-tag }}
      image-digest: ${{ needs.build.outputs.image-digest }}
    secrets: inherit

  # ── Deploy to prod ───────────────────────────────────────────────────
  deploy-prod:
    name: Deploy to Prod
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.environment == 'prod'
    uses: ./.github/workflows/_deploy-environment.yml
    with:
      environment: prod
      image-tag: ${{ needs.build.outputs.image-tag }}
      image-digest: ${{ needs.build.outputs.image-digest }}
    secrets: inherit
